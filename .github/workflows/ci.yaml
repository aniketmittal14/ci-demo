name: CI

on: push

jobs: 
  linting:
     runs-on: ${{ matrix.os }}

     strategy:
       matrix:
         os: [ubuntu-latest,windows-latest,macos-latest]
         version: ['3.13','3.14','3.15']

     steps:
       - name: code checkout
         uses: actions/checkout@v3

       - name: setup python
         uses: actions/setup-python@v6
         with:
           python-version: ${{ matrix.version }}

       - name: install flake8
         run: |
           python -m pip install --upgrade pip
           pip install flake8 

       - name: run flake8
         run: |
           flake8 app.py
    

 